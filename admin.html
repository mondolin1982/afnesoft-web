<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة مكتبة Afnesoft</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><a href="catalog.html">← المكتبة العامة</a><strong>Afnesoft <small>ADMIN</small></strong></header><main><section id="login" class="panel login"><div class="mark">A</div><h1>إدارة المكتبة</h1><p>سجّل الدخول بحساب المدير المضاف في Supabase.</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" required autocomplete="username"></label><label>كلمة المرور<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">تسجيل الدخول</button><p id="loginError" class="error"></p></form></section><section id="dashboard" hidden><div class="welcome"><div><label>CONTENT MANAGEMENT</label><h1>إدارة المحتوى</h1><p>أضف البرامج والفيديوهات وأدر الملفات.</p></div><button id="logout" class="secondary">تسجيل الخروج</button></div><div class="columns"><section class="panel"><h2>إضافة / تعديل محتوى</h2><form id="resourceForm"><input id="id" type="hidden"><label>النوع<select id="type"><option value="software">برنامج قابل للتحميل</option><option value="video">فيديو / شرح</option></select></label><div class="two"><label>الاسم بالعربية<input id="title_ar" required></label><label>Title in English<input id="title_en"></label></div><div class="two"><label>الوصف بالعربية<textarea id="description_ar" rows="3"></textarea></label><label>English description<textarea id="description_en" rows="3"></textarea></label></div><div class="two"><label>التصنيف<input id="category" placeholder="أنظمة الإدارة"></label><label>الإصدار<input id="version" value="1.0"></label></div><label id="fileLabel">ملف البرنامج<input id="file" type="file"></label><label id="videoLabel" hidden>رابط الفيديو<input id="video_url" type="url" placeholder="https://youtube.com/..."></label><label>رابط صورة الغلاف (اختياري)<input id="thumbnail_url" type="url"></label><label class="check"><input id="published" type="checkbox" checked> منشور ومتاح للجميع</label><div class="actions"><button id="save" class="primary">حفظ المحتوى</button><button id="reset" class="secondary" type="button">تفريغ الحقول</button></div><p id="formMessage"></p></form></section><section class="panel"><div class="listhead"><h2>المحتوى الحالي</h2><button id="refresh" class="secondary">تحديث</button></div><div id="list">جارٍ التحميل...</div></section></div></section></main><script src="admin.js"></script></body></html>
